Resources:
  LrcTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: lrc
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: week_key
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: week_key
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- Auth Section ---

  # The User Pool
  LrcUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: lrc-user-pool
      UsernameAttributes:
        - email
      autoConfirm_sign_up: true
      mfaConfiguration: 'OFF'
      messageAction: 'SUPPRESS'
      passwordPolicy:
        minimumLength: 16
        requireLowercase: true
        requireNumbers: true
        requireUppercase: true
        requireSymbols: true
      signInExperience:
        smsMfa:
          enabled: false
      # Link to your frontend's Redirect URI
      Client_Names:
        - lightning-run-club-client
      ScopeCreationPolicy: 'ALLOW_ALL'

  # Custom Domain for Cognito (OAuth Web Server)
  LrcUserPoolDomainConfig:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lrc-custom-domain
      UserPoolId:
        Ref: LrcUserPool
      GenerateSecret: false
      ConsentScreenEnabled: false
      ExplicitAuthFlows: []

  # Custom Domain Certificate for Cognito (auth.kwagner.dev)
  # NOTE: Certificate configuration should be applied post-deploy via SAM hooks
  # or AWS Console, not hardcoded here. For production, use a pre-built image
  # that applies the certificate automatically after IAM role attach and SNS config.

  # SES Configuration via SNS integration
  # Cognito uses SNS for email delivery; configure in console after deploy
  LrcSesEmailConfiguration:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: lrc-email-notifications
      Tags:
        - Key: Name
          Value: LRC Email Notifications

  # The App Client used by the frontend
  LrcAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lightning-run-club-client
      UserPoolId:
        Ref: LrcUserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - 'code'
        - 'refresh_token_grant'
      AllowedOAuthScopes:
        - 'email'
      AllowedOAuthRedirectUris:
        - 'http://localhost:3000/lightning-fitness-challenge'
        - 'https://kwagner.dev/lightning-fitness-challenge'
      ExplicitAuthFlows:
        - 'ALLOW_REFRESH_TOKEN_SECRET'

  # --- Lambda Section ---

  StravaAuth:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bootstrap
      Runtime: provided.al2
      CodeUri: backend/strava-auth/
      Environment:
        Variables:
          TABLE_NAME: !Ref LrcTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref LrcTable
      Events:
        AuthCallback:
          Type: Api
          Properties:
            Path: /auth/callback
            Method: get

Outputs:
  UserPoolId:
    Description: 'The ID of the Cognito User Pool'
    Value: !Ref LrcUserPool
  AppClientId:
    Description: 'The ID of the Cognito App Client'
    Value: !Ref LrcAppClient
  UserPoolDomainConfigArn:
    Description: 'ARN of the OAuth Web Server client for custom domain'
    Value: !GetAtt LrcUserPoolDomainConfig.Arn
  SesEmailConfigurationArn:
    Description: 'SNS Topic for SES email delivery'
    Value: !Ref LrcSesEmailConfiguration
