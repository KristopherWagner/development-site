# Cognito & Email Configuration for Lightning Run Club
# Configured in AWS Console and documented here for reference

# IMPORTANT: ACM certificate ARN is NOT stored here — it's sensitive infrastructure
# configuration. Apply certificates post-deploy via SAM hooks or console.
# See documentation on secure certificate management below.

# User Pool Settings
COGNITO_USER_POOL_ID: "us-east-1_iaIl71UJS"
COGNITO_CUSTOM_DOMAIN: "https://auth.kwagner.dev"

# Email Provider Configuration (Amazon SES)
SES_REGION: "us-east-1"  # US East (N. Virginia)
FROM_EMAIL_ADDRESS: "hello@kwagner.dev"
FROM_SENDER_NAME: "Kristopher Wagner <hello@kwagner.dev>"

# Note: After SAM deploy, configure email delivery in Cognito console:
# 1. Go to User Pool settings -> Message Customizations
# 2. Add SNS Topic ARN from LrcSesEmailConfiguration output
# 3. Verify email templates work with your SES configuration

# Strava Integration
STRAVA_CLIENT_ID: "YOUR_STRAVA_CLIENT_ID"
STRAVA_REDIRECT_URI: "https://auth.kwagner.dev/strava/callback"

# Environment Variables for Lambda Functions (from SAM deploy outputs)
AWS_REGION: "us-east-1"
ENVIRONMENT: "production"
